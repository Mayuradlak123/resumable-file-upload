name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/resumable-file-upload
    permissions:
      id-token: write  # Mandatory for Trusted Publishing
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # A release tagged from the wrong commit is the easy mistake here, and it
    # otherwise fails deep inside the build with a confusing error. Fail early
    # and say exactly what is wrong.
    - name: Check the tag matches the version in pyproject.toml
      run: |
        if [ ! -f pyproject.toml ]; then
          echo "::error::No pyproject.toml at ${{ github.ref_name }} — the release was tagged from the wrong commit."
          exit 1
        fi
        project_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        tag_version="${GITHUB_REF_NAME#v}"
        echo "tag=$tag_version  pyproject=$project_version"
        if [ "$tag_version" != "$project_version" ]; then
          echo "::error::Tag ${{ github.ref_name }} does not match project version $project_version. Tag the release v$project_version, or bump the version first."
          exit 1
        fi

    - name: Install build dependencies
      run: python -m pip install build --user

    - name: Build binary wheel and source tarball
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
